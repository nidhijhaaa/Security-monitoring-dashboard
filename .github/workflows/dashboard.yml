name: Generate Security Dashboard

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 8 * * 1' # Run every Monday at 8:00 AM UTC
  push:
    branches: [ "main" ]
    paths: # Only run if the script or workflow changes
      - '.github/workflows/dashboard.yml'
      - 'scripts/generate_dashboard.py'

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    permissions:  
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Dashboard
        env:
          GH_TOKEN: ${{ secrets.GH_DASHBOARD_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_dashboard.py

      - name: Debug - Check generated files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in directory:"
          ls -la
          echo "Checking if index.html exists:"
          if [ -f "index.html" ]; then
            echo "index.html exists!"
            echo "First few lines:"
            head -3 index.html
          else
            echo "index.html does NOT exist!"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
          force_orphan: true # This ensures a clean deployment every time
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
